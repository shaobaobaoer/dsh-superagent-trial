name: agent trial

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to comment on
        required: true
        default: '1'

permissions:
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
        with:
          script: |
            const issue_number = Number(process.env.ISSUE)
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: '@shaobaobaoer Please fix the typo in README.md: "agnet" should be "agent".'
            })
